# Variables que usa el experimento. Cambia `seleccion` para elegir el conjunto.
#   ALL:     las 23 variables (demográficas + historial de pago + montos).
#   NUMERIC: solo las variables numéricas (excluye SEX/EDUCATION/MARRIAGE).
#   CUSTOM:  solo las variables listadas en `custom`.
# Ver ../actividad-1/docs/diccionario-datos.md para el detalle de cada columna.
seleccion: ALL

numeric:
  - LIMIT_BAL
  - AGE
  - PAY_0
  - PAY_2
  - PAY_3
  - PAY_4
  - PAY_5
  - PAY_6
  - BILL_AMT1
  - BILL_AMT2
  - BILL_AMT3
  - BILL_AMT4
  - BILL_AMT5
  - BILL_AMT6
  - PAY_AMT1
  - PAY_AMT2
  - PAY_AMT3
  - PAY_AMT4
  - PAY_AMT5
  - PAY_AMT6

# Solo se usa cuando seleccion es CUSTOM. Provisional: historial de pago + límite,
# sin variables demográficas -- a confirmar antes de implementar el pipeline.
custom:
  - LIMIT_BAL
  - PAY_0
  - PAY_2
  - PAY_3
  - PAY_4
  - PAY_5
  - PAY_6
