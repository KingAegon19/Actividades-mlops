# Configuración de la actividad 1: datos, modelo y tracking.
# No se escriben valores en el código: todo se lee desde aquí.

datos:
  # Dataset público "Default of Credit Card Clients" (UCI, Taiwan)
  # https://www.kaggle.com/datasets/uciml/default-of-credit-card-clients-dataset
  ruta: "data/credit_card_default.csv"
  objetivo: "default.payment.next.month"

modelo:
  nombre: "logistic_regression" # p.ej. logistic_regression, random_forest
  random_state: 42
  test_size: 0.2

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "actividad-1"

prefect:
  api_url: "http://localhost:4200/api"
