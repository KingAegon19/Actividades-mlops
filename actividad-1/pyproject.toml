[project]
name = "actividad-1-mlops"
version = "0.1.0"
description = "Actividad 1 MLOps: estructura, entorno reproducible y tracking con MLflow/Prefect"
authors = [
    {name = "KingAegon19",email = "jupavehu1@gmail.com"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "prefect (==3.8.8)",
    "mlflow (==3.17.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
